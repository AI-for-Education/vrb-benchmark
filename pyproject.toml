[project]
name = "vrb-benchmark"
version = "0.0.0"
description = "Vrb Benchmark"

readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fabdata-llm>=0.28.1",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.6",
    "jinja2>=3.1.6",
    "joblib>=1.4.2",
    "jupyter>=1.1.1",
    "loguru>=0.7.3",
    "marimo>=0.13.0",
    "matplotlib>=3.10.5",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pymupdf>=1.25.5",
    "python-dotenv>=1.1.0",
    "seaborn>=0.13.2",
    "watchdog>=6.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
analysis = [
    "bambi>=0.16.0",
    "arviz>=0.22.0",
    "statsmodels>=0.14.5",
    "pyfonts>=0.0.2",
    "scikit-learn>=1.7.2",
]

[tool.uv.sources]
fabdata-llm = { git = "https://github.com/AI-for-Education/fabdata-llm.git", rev = "main" }

[project.urls]
Repository = "https://github.com/vrb-benchmark"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pre-commit>=3.6.0",
    "pre-commit-hooks>=4.5.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "myst-parser>=2.0.0",
    "pytest-mock>=3.12.0",
    "tox>=4.0.0",
    "tox-uv>=1.0.0",
]

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["vrb_benchmark", "tests"]

[tool.coverage.report]
show_missing = true
fail_under = 40

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"src/vrb_benchmark/__init__.py" = [
    "E402",  # module-import-not-at-top-of-file (imports after setup code)
]
"scripts/*.py" = [
    "E402",  # module-import-not-at-top-of-file (Jupyter notebook style)
    "F841",  # unused-variable (common in exploratory scripts)
]
"test_*.py" = [
    "E402",  # module-import-not-at-top-of-file (Jupyter notebook style)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
